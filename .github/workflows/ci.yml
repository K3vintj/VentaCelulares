name: Validate store and API
on:
  push:
    branches: [conexion-backend, develop, master, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/unused
      VC_INTEGRATION: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          lfs: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global pnpm@10.34.3
      - run: pnpm install --frozen-lockfile
      - run: npm --prefix backend ci
      - run: npm run build:all
      - run: npm run test:api
      - run: npm --prefix backend audit --omit=dev --audit-level=high
